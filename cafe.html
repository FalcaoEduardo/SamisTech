    <style>
        /* Trava o fundo para evitar rolagem da página inteira no celular */
        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .img-hover img { transition: transform 0.5s ease; }
        .img-hover:hover img { transform: scale(1.05); }

        @keyframes fadeInSoft {
            0% { opacity: 0; filter: blur(2px); }
            100% { opacity: 1; filter: blur(0); }
        }
        .fade-in-soft {
            animation: fadeInSoft 3.5s ease-out forwards;
        }

        /* Oculta a barra de rolagem estética na caixa principal */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Carrossel de fotos */
        .carousel-track {
            cursor: grab;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }
        .carousel-track.dragging {
            cursor: grabbing;
        }

        /* Animação de entrada do quadro principal */
        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(24px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-enter {
            animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Lightbox (Foto ampliada) */
        #lightbox {
            transition: opacity 0.25s ease;
        }
        #lightbox img {
            animation: cardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Tela de Senha */
        #password-gate {
            animation: fadeInSoft 0.4s ease-out both;
        }
        #password-input {
            letter-spacing: 0.15em;
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Sistema de Corações Flutuantes */
        .heart {
            position: absolute;
            top: 110%;
            transform: rotate(-45deg);
            opacity: 0.6; 
        }
        .heart:before, .heart:after {
            position: absolute;
            display: block;
            content: "";
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 100%;
        }
        .heart:before { top: -50%; left: 0; }
        .heart:after { top: 0; right: -50%; }

        @keyframes love {
            0% { top: 110%; }
            100% { top: -20%; } 
        }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 font-sans antialiased relative min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

                    <img src="assets/02.JPG" alt="" class="w-full h-full object-cover" draggable="false" onerror="this.style.display='none'">
                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center transition-colors duration-300 group-hover:bg-black/40">
                        <h3 class="text-white text-[9px] md:text-lg font-bold tracking-widest uppercase text-center leading-tight md:leading-relaxed">

    <!-- Script 1: Lógica do Texto Emocional -->
    <script>
        var speed = 40;       
        var holdTime = 2500;  
        var fadeTime = 500;   

        var paragraphs = [
            "Feliz aniversário, Lulu!|Hoje é um daqueles dias que o coração se recusa a esquecer.",
            "Existem coisas que o tempo simplesmente não apaga,|e o que sinto por você é a maior delas.",
            "Hoje entendo tudo o que aconteceu.|Eu precisava lutar pela minha saúde e focar no meu tratamento...",
            "...e a vida nos empurrou para caminhos diferentes|pois eu não tinha como ser o parceiro que você merecia.",
            "Mas a verdade nua e crua|é que você nunca saiu da minha cabeça.",
            "Sinto falta da nossa parceria|e de como a vida parecia mais certa com você do meu lado.",
            "Se eu pudesse fazer um único pedido hoje,|seria ter a chance de vivermos nós dois de novo...",
            "...agora que estou bem, inteiro|e pronto para entregar o que não pude lá atrás.",
            "Independentemente de qualquer coisa,|você sempre será a minha luz."
        ];

        var pIndex = 0;
        var charIndex = 0;
        var textEl = document.getElementById("text1");

        function typeParagraph() {
            var current = paragraphs[pIndex];
            if (charIndex < current.length) {
                var ch = current.charAt(charIndex);
                textEl.innerHTML += (ch === '|') ? '<br>' : ch;
                charIndex++;
                setTimeout(typeParagraph, speed);
            } else {
                setTimeout(fadeOutParagraph, holdTime);
            }
        }

        function fadeOutParagraph() {
            textEl.style.opacity = 0;
            setTimeout(function () {
                textEl.innerHTML = '';
                textEl.style.opacity = 1;
                charIndex = 0;
                pIndex++;
                if (pIndex < paragraphs.length) {
                    setTimeout(typeParagraph, 200);
                } else {
                    showFinalMessage();
                }
            }, fadeTime);
        }

        function showFinalMessage() {
            textEl.innerHTML = '<div class="opacity-0 fade-in-soft mt-2"><span class="font-sans text-rose-500 font-medium text-xl md:text-2xl block">eu te amo nunca deixarei de te amar ❤️</span></div>';
        }

        window.startTextCycle = function () {
            setTimeout(typeParagraph, 500);
        };
    </script>

    <!-- Script 2: Animação dos Corações -->
    <script>
        window.startHearts = function () {
            setInterval(function(){
                var r_size = Math.floor(Math.random() * 30) + 15;
                var r_left = Math.floor(Math.random() * 100) + 1;
                var r_time = Math.floor(Math.random() * 10) + 8;
                var r_bg = Math.floor(Math.random() * 50) + 150;
                
                $('#bg_heart').append("<div class='heart' style='width:"+r_size+"px;height:"+r_size+"px;left:"+r_left+"%;background:rgba(255,"+(r_bg-50)+","+r_bg+",1);animation:love "+r_time+"s linear forwards'></div>");
            }, 600);

            // Coletor de lixo para não travar o navegador
            setInterval(function() {
                if ($('.heart').length > 40) {
                    $('.heart').first().remove();
                }
            }, 1000);
        };
    </script>

    <!-- Script 3: Lógica do Carrossel e Lightbox -->
    <script>
        (function () {
            var track = document.querySelector('.carousel-track');
            var outer = document.querySelector('.carousel-outer');
            if (!track || !outer) return;

            var posX = 0;           
            var autoSpeed = 0.35;   
            var isDragging = false;
            var isHovering = false;
            var startX = 0;
            var startPos = 0;
            var dragMoved = 0;      
            var pressedImg = null;  

            function getSetWidth() {
                return track.scrollWidth / 2;
            }

            function wrap(x) {
                var setWidth = getSetWidth();
                if (setWidth <= 0) return x;
                x = x % setWidth;
                if (x > 0) x -= setWidth;
                return x;
            }

            function render() {
                track.style.transform = 'translateX(' + posX + 'px)';
            }

            function tick() {
                if (!isDragging && !isHovering) {
                    posX = wrap(posX - autoSpeed);
                    render();
                }
                requestAnimationFrame(tick);
            }

            function getClientX(e) {
                return e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
            }

            var lightbox = document.getElementById('lightbox');
            var lightboxImg = document.getElementById('lightbox-img');
            var lightboxClose = document.getElementById('lightbox-close');

            function openLightbox(src) {
                lightboxImg.src = src;
                lightbox.classList.remove('hidden');
                lightbox.classList.add('flex');
            }

            function closeLightbox() {
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
                lightboxImg.src = '';
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function (e) {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLightbox();
            });

            function onPointerDown(e) {
                isDragging = true;
                dragMoved = 0;
                startX = getClientX(e);
                startPos = posX;
                var card = e.target && e.target.closest ? e.target.closest('.carousel-item') : null;
                pressedImg = card ? card.querySelector('img') : null;
                track.classList.add('dragging');
                if (e.pointerId !== undefined && track.setPointerCapture) {
                    track.setPointerCapture(e.pointerId);
                }
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                var delta = getClientX(e) - startX;
                dragMoved = Math.abs(delta);
                posX = startPos + delta;
                render();
            }

            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                track.classList.remove('dragging');
                posX = wrap(posX);
                render();

                if (dragMoved <= 6 && pressedImg) {
                    openLightbox(pressedImg.src);
                }
                pressedImg = null;
            }

            track.addEventListener('pointerdown', onPointerDown);
            track.addEventListener('pointermove', onPointerMove);
            track.addEventListener('pointerup', endDrag);
            track.addEventListener('pointercancel', endDrag);
            track.addEventListener('pointerleave', endDrag);

            outer.addEventListener('mouseenter', function () { isHovering = true; });
            outer.addEventListener('mouseleave', function () { isHovering = false; });

            window.startCarousel = function () {
                requestAnimationFrame(tick);
            };
        })();
    </script>

    <!-- Script 4: Integração com GoatCounter e Tela de Senha -->
    <script>
        function registrarSenhaCorreta() {
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({
                    path: 'senha-correta',
                    title: 'Senha correta digitada',
                    event: true
                });
            }
        }

        (function () {
            var CORRECT_CODE = '2408';
            var gate = document.getElementById('password-gate');
            var form = document.getElementById('password-form');
            var input = document.getElementById('password-input');
            var errorMsg = document.getElementById('password-error');
            var content = document.querySelector('section.card-enter');

            input.addEventListener('input', function () {
                var digits = input.value.replace(/\D/g, '').slice(0, 4);
                input.value = digits.length > 2 ? digits.slice(0, 2) + '/' + digits.slice(2) : digits;
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var digitsOnly = input.value.replace(/\D/g, '');
                if (digitsOnly === CORRECT_CODE) {
                    registrarSenhaCorreta();
                    gate.remove();
                    content.style.display = '';
                    
                    setTimeout(function () {
                        if (window.startHearts) window.startHearts();
                        if (window.startTextCycle) window.startTextCycle();
                        if (window.startCarousel) window.startCarousel();
                    }, 50);
                } else {
                    errorMsg.classList.remove('hidden');
                    input.classList.add('shake');
                    input.value = '';
                    input.focus();
                    setTimeout(function () { input.classList.remove('shake'); }, 400);
                }
            });
        })();
    </script>
